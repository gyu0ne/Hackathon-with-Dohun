Global:
  model_name: korean_PP-OCRv5_mobile_rec
  debug: false
  use_gpu: true
  use_amp: true
  amp_level: O1
  amp_dtype: float16
  scale_loss: 1024.0
  use_dynamic_loss_scaling: true
  epoch_num: 2
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /workspace/ocr_training/artifacts/checkpoints
  save_epoch_step: 1
  save_batch_step: 500
  recovery_keep: 3
  eval_batch_step: [0, 10000]
  cal_metric_during_train: true
  pretrained_model:
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: /opt/PaddleOCR/ppocr/utils/dict/ppocrv5_korean_dict.txt
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: /workspace/ocr_training/artifacts/predictions.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size: [1, 3]
          use_guide: true
        Head:
          fc_decay: 0.00001
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss:
  - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: AIHubStreamDataSet
    split: train
    index_dir: /workspace/ocr_training/data
    data_root: /datasets/aihub_ocr
    cache_mb: 128
    padding_ratio: 0.06
    transforms:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: DocumentBatchSampler
    batch_size: &batch_size 128
    drop_last: true
    seed: 2026
  loader:
    shuffle: true
    batch_size_per_card: *batch_size
    drop_last: true
    num_workers: 8

Eval:
  dataset:
    name: AIHubStreamDataSet
    split: dev
    index_dir: /workspace/ocr_training/data
    data_root: /datasets/aihub_ocr
    cache_mb: 128
    padding_ratio: 0.06
    transforms:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 4
